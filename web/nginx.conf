server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: /trades/<id> is not a file on disk, so anything that
    # is not an asset falls back to the app shell and React Router takes it
    # from there. Without this, deep links and a page refresh both 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy would not reach a returning
    # browser until it happened to clear its cache.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
