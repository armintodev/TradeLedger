name: tradeledger

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: tradeledger
      POSTGRES_USER: tradeledger
      POSTGRES_PASSWORD: tradeledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeledger -d tradeledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
