name: tradeledger

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: tradeledger
      POSTGRES_USER: tradeledger
      POSTGRES_PASSWORD: tradeledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeledger -d tradeledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        # Baked into the bundle at build time. Point it at wherever the API is
        # reachable *from the browser*, not from inside the compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
